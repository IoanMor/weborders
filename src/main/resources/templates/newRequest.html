<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 18px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
            color: #f8fafc;
            outline: none;
        }

        input.error-field, textarea.error-field {
            border-color: #f87171;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 24px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #67d3ff;
        }

        .hint {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 12px;
        }

        .checkbox label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #38bdf8;
        }

        .alert {
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid #38bdf8;
            color: #38bdf8;
        }

        .alert-error {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid #f87171;
            color: #f87171;
        }

        .field-error {
            color: #f87171;
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <h1>Оставить заявку</h1>
        <p>Опишите задачу — я предложу простое решение для автоматизации.</p>

        <!-- Успех -->
        <div th:if="${success}" class="alert alert-success">
            ✓ <span th:text="${success}"></span>
        </div>

        <!-- Ошибка -->
        <div th:if="${ERROR}" class="alert alert-error">
            ✕ <span th:text="${ERROR}"></span>
        </div>

        <form th:action="@{/view/services/request/new/add}" th:object="${requestFormDTO}" method="post">

            <label>Имя</label>
            <input type="text"
                   th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'error-field'"
                   placeholder="Ваше имя">
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></span>

            <label>Номер телефона</label>
            <input type="text"
                   th:field="*{tNumber}"
                   th:classappend="${#fields.hasErrors('tNumber')} ? 'error-field'"
                   placeholder="+7...">
            <span th:if="${#fields.hasErrors('tNumber')}" th:errors="*{tNumber}" class="field-error"></span>

            <label>Описание проекта</label>
            <textarea th:field="*{description}"
                      th:classappend="${#fields.hasErrors('description')} ? 'error-field'"
                      placeholder="Опишите свою идею"></textarea>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error"></span>

            <div class="checkbox">
                <label>
                    <input type="checkbox" required>
                    Я принимаю условия
                    <a th:href="@{/view/services/privacy}" target="_blank">Политики обработки персональных данных</a>
                </label>
            </div>

            <button type="submit">Отправить заявку</button>

        </form>

        <div class="hint">
            Нажимая кнопку, вы отправляете заявку на обработку.
        </div>

    </div>
</div>

</body>
</html>
